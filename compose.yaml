name: wearly

services:
  web:
    build: ./apps/web
    environment:
      WEARLY_DOMAIN: ${WEARLY_DOMAIN:?Set WEARLY_DOMAIN in the deployment .env file}
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - type: bind
        source: ./deploy/Caddyfile
        target: /etc/caddy/Caddyfile
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ./deploy/users.caddy
        target: /etc/caddy/users.caddy
        read_only: true
        bind:
          create_host_path: false
      - certificates:/data
      - caddy-config:/config
    networks: [edge, private]
    depends_on:
      api:
        condition: service_healthy
    logging: {driver: local}
    restart: unless-stopped

  api:
    build: ./apps/api
    environment:
      NODE_ENV: production
      WEARLY_BIND_HOST: 0.0.0.0
      WEARLY_DATA_DIR: /var/lib/wearly/data
      WEARLY_PUBLIC_ORIGIN: https://${WEARLY_DOMAIN:?Set WEARLY_DOMAIN in the deployment .env file}
      WEARLY_CUTOUT_URL: http://cutout:7000/cutout
    volumes:
      - type: bind
        source: ${WEARLY_STATE_DIR:-/srv/wearly}
        target: /var/lib/wearly
        bind:
          create_host_path: false
    networks: [private]
    healthcheck:
      test: ['CMD', 'node', '-e', 'fetch("http://127.0.0.1:3000/health").then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))']
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 10s
    depends_on:
      cutout:
        condition: service_healthy
    logging: {driver: local}
    restart: unless-stopped
    stop_grace_period: 30s

  cutout:
    build: ./apps/cutout
    networks: [private]
    healthcheck:
      test: ['CMD', 'python', '-c', 'from urllib.request import urlopen; urlopen("http://127.0.0.1:7000/health", timeout=2).close()']
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 60s
    logging: {driver: local}
    restart: unless-stopped

networks:
  edge:
  private:
    internal: true

volumes:
  certificates:
  caddy-config:
